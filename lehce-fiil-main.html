<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a0f;color:#e8e4d9;font-family:monospace,-apple-system,sans-serif;}
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}

.nav-title{color:#e8e4d9;font-size:0.9rem;font-weight:600;}

.logo{width:76px;height:76px;border-radius:18px;border:2px solid #c8a96e;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:700;color:#c8a96e;font-family:Georgia,serif;margin-bottom:14px;}
.ana-h1{font-family:Georgia,serif;font-size:1.9rem;color:#e8e4d9;margin-bottom:5px;}
.ana-sub{font-size:0.65rem;color:#7a7890;letter-spacing:0.18em;margin-bottom:3px;}
.ana-ver{font-size:0.6rem;color:#3a3a52;letter-spacing:0.15em;margin-bottom:40px;}
.ana-cards{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;margin-bottom:40px;}
.ana-card{display:flex;align-items:center;gap:14px;padding:18px;background:#13131a;border:1px solid #c8a96e55;border-radius:14px;width:100%;text-align:left;cursor:pointer;color:#e8e4d9;font-family:monospace;}
.ana-card *{pointer-events:none;}
.ana-card.hl{border-color:#c8a96e55;}
.ana-icon{font-size:1.8rem;flex-shrink:0;}
.ana-ctitle{font-size:1rem;font-weight:600;font-family:Georgia,serif;margin-bottom:3px;}
.ana-cdesc{font-size:0.7rem;color:#7a7890;}
.ana-arr{margin-left:auto;color:#5a5a72;font-size:1.2rem;}
.ana-footer{text-align:center;color:#3a3a52;font-size:0.65rem;line-height:2;}
.settings-panel{display:none;position:fixed;top:52px;right:12px;background:#1e1e28;border:1px solid #3a3a52;border-radius:12px;padding:14px;z-index:999;min-width:250px;box-shadow:0 8px 32px #000e;}
.settings-panel.open{display:block;}
.settings-title{color:#c8a96e;font-family:Georgia,serif;font-size:.9rem;margin-bottom:10px;font-weight:600;}
.settings-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #2e2e3e;}
.settings-row:last-child{border-bottom:none;}
.settings-row input{width:16px;height:16px;accent-color:#c8a96e;flex-shrink:0;}
.settings-row label{color:#e8e4d9;font-size:.78rem;line-height:1.3;}
.settings-row label span{display:block;color:#7a7890;font-size:.68rem;}
.settings-save{width:100%;margin-top:10px;padding:9px;background:#c8a96e;color:#0f0f13;border:none;border-radius:7px;font-family:monospace;font-weight:600;font-size:.82rem;cursor:pointer;}
</style>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;background:#0f0f13;color:#e8e4d9;font-family:monospace;}
h1{color:#c8a96e;text-align:center;margin:0 0 12px;font-size:1.4rem;}
#inp{width:100%;padding:12px;background:#1e1e28;border:2px solid #3a3a52;border-radius:8px;color:#e8e4d9;font-size:1rem;font-family:monospace;outline:none;display:block;margin-bottom:8px;}
.keys{display:flex;gap:4px;margin-bottom:8px;}
.key{flex:1;padding:9px 0;background:#1e1e28;border:1px solid #3a3a52;border-radius:6px;color:#e8e4d9;font-size:1rem;text-align:center;cursor:pointer;}
#ara{width:100%;padding:13px;background:#c8a96e;color:#000;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer;margin-bottom:12px;display:block;}
.card{padding:11px;background:#1e1e28;border:1px solid #3a3a52;border-radius:8px;margin-bottom:7px;cursor:pointer;}
.cn{color:#5b8dee;font-weight:bold;}
.cd{color:#5ec27f;}
.ca{color:#7a7890;font-size:0.8rem;margin-top:2px;}
.th{color:#c8a96e;font-size:0.7rem;margin:13px 0 5px;border-bottom:1px solid #2e2e3e;padding-bottom:2px;}
.row{display:grid;gap:4px;margin-bottom:4px;}
.cell{background:#18181f;border:1px solid #2e2e3e;border-radius:5px;padding:7px 8px;}
.per{font-size:0.6rem;color:#7a7890;}
.val{font-size:0.85rem;}
</style>
<style>html,body{margin:0;padding:0;background:#0f0f13;} * { box-sizing: border-box; margin: 0; padding: 0; } :root { --bg: #0f0f13; --surface: #18181f; --card: #1e1e28; --border: #2e2e3e; --accent: #c8a96e; --accent2: #5b8dee; --niedo: #5b8dee; --doko: #5ec27f; --text: #e8e4d9; --muted: #7a7890; --wrong: #e05c5c; --correct: #5ec27f; } body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; } .app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 48px; } .header { text-align: center; margin-bottom: 32px; } .header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem, 5vw, 2.4rem); color: var(--accent); letter-spacing: 0.02em; line-height: 1.2; } .header p { margin-top: 6px; font-size: 0.78rem; color: var(--muted); letter-spacing: 0.05em; } .score-bar { display: flex; gap: 20px; margin-bottom: 28px; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; } .score-bar span strong { color: var(--text); font-size: 1.05rem; } .progress-wrap { width: min(520px, 100%); height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 28px; overflow: hidden; } .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; } .card { width: min(520px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 28px 24px; position: relative; overflow: hidden; } .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--niedo), var(--doko)); } .verb-pair { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; } .verb-chip { padding: 5px 14px; border-radius: 20px; font-size: 0.88rem; font-weight: 500; letter-spacing: 0.03em; } .niedo-chip { background: rgba(91,141,238,0.15); color: var(--niedo); border: 1px solid rgba(91,141,238,0.3); } .doko-chip { background: rgba(94,194,127,0.1 pt-btn.wrong .opt-letter { background: var(--wrong); color: #fff; } .opt-btn.reveal-correct { border-color: var(--correct); background: rgba(94,194,127,0.08); color: var(--correct); } .opt-btn:disabled { cursor: default; } .typo-tag { display: block; font-size: 0.62rem; color: #c8a96e; opacity: 0.75; margin-top: 4px; letter-spacing: 0.04em; } @keyframes pulse-green { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } } @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-4px); } 100% { transform: translateX(0); } } .feedback-row { min-height: 32px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; margin-bottom: 4px; } .feedback-icon { font-size: 1.1rem; } .feedback-text.correct-fb { color: var(--correct); } .feedback-text.wrong-fb { color: var(--wrong); } .next-btn { width: 100%; margin-top: 16px; padding: 14px; border-radius: 10px; background: var(--accent); color: #0f0f13; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; letter-spacing: 0.05em; transition: opacity 0.18s, transform 0.18s; } .next-btn:hover { opacity: 0.88; transform: translateY(-1px); } .next-btn:active { transform: translateY(0); } .result-card { width: min(520px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 36px 28px; text-align: center; } .result-emoji { font-size: 3rem; margin-bottom: 12px; } .result-title { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--accent); margin-bottom: 8px; } .result-score { font-size: 2.4rem; font-weight: 600; color: var(--text); margin: 16px 0 4px; } .result-pct { font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; } .restart-btn { padding: 14px 36px; border-radius: 10px; background: var(--accent); color: #0f0f13; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; letter-spacing: 0.05em; transition: opacity 0.18s; } .restart-btn:hover { opacity: 0.88; } .q-counter { font-size: 0.72rem; color: var(--muted); text-align: right; margin-bottom: 14px; letter-spacing: 0.06em; } #quiz-screen{display:none;} #result-screen{display:none;} .settings-title{color:#c8a96e;font-family:Georgia,serif;font-size:1rem;margin-bottom:12px;font-weight:600;} .settings-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2e2e3e;cursor:pointer;} .settings-row:last-child{border-bottom:none;} .settings-row input[type=checkbox]{width:18px;height:18px;accent-color:#c8a96e;cursor:pointer;flex-shrink:0;} .settings-row label{color:#e8e4d9;font-size:0.82rem;cursor:pointer;line-height:1.4;} .settings-row label span{display:block;color:#7a7890;font-size:0.72rem;margin-top:2px;} .settings-save{width:100%;margin-top:12px;padding:10px;background:#c8a96e;color:#0f0f13;border:none;border-radius:8px;font-family:monospace;font-weight:600;font-size:0.85rem;cursor:pointer;}</style>

<body>

<!-- ANA SAYFA -->
<div id="screen-ana" class="screen">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;min-height:100vh;">
    <div class="logo">LF</div>
    <div class="ana-h1">Lehçe Fiil</div>
    <div class="ana-sub">POLONCA · FİİL ÇALIŞMA ARAÇLARI</div>
    <div class="ana-ver">VER 1.0</div>
    <div class="ana-cards">
      <button class="ana-card hl" id="btn-tablosu">
        <div class="ana-icon">📖</div>
        <div><div class="ana-ctitle">Fiil Tablosu</div><div class="ana-cdesc">Fiil arayın, tüm çekim tablolarını görün</div></div>

</div>

var STAR_PTS = "12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26";

function norm(s){ return s.toLowerCase().replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l').replace(/ń/g,'n').replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z'); }

function makeStar(size,fill,stroke,glow){ var s=document.createElementNS(SVG_NS,'svg'); s.setAttribute('width',size);s.setAttribute('height',size);s.setAttribute('viewBox','0 0 24 24');s.style.display='block'; if(glow)s.style.filter=glow; var p=document.createElementNS(SVG_NS,'polygon'); p.setAttribute('points',STAR_PTS);p.setAttribute('fill',fill);p.setAttribute('stroke',stroke);p.setAttribute('stroke-width','1.5');s.appendChild(p);return s; }

function renderHistoryStars(id,history){ var c=document.getElementById(id);if(!c)return;c.innerHTML=''; for(var i=0;i<5;i++){var idx=history.length-5+i;var pct=(idx>=0&&idx<history.length)?history[idx]:null;var fill='none',stroke='#3a3a52',glow=''; if(pct!==null){if(pct>=80){fill='#f5c842';stroke='#f5c842';glow='drop-shadow(0 0 6px #f5c84288)';}else if(pct>=51){fill='#9a8040';stroke='#9a8040';}else{fill='#2a2a3a';stroke='#3a3a52';}} c.appendChild(makeStar(28,fill,stroke,glow));} }

function ins(c){
  var e=document.getElementById('inp');
  var s=e.selectionStart||e.value.length;
  e.value=e.value.slice(0,s)+c+e.value.slice(s);
  e.focus();
}

function norm(s){
  return s.toLowerCase()
    .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e')
    .replace(/ł/g,'l').replace(/ń/g,'n').replace(/ó/g,'o')
    .replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
}

function t_ara(){
  var q=norm(document.getElementById('inp').value.trim());
  var o=document.getElementById('t-out');
  o.innerHTML='';
  if(!q){o.innerHTML='<div style="color:#7a7890;padding:8px">Bir seyler yazin</div>';return;}
  var starts=[],others=[];
  for(var i=0;i<VB.length;i++){
    var v=VB[i];
    var nn=norm(v.niedo),nd=norm(v.doko||'');
    var matchStart=nn.indexOf(q)===0||(nd.length>1&&nd.indexOf(q)===0);
    var matchAny=nn.indexOf(q)!==-1||nd.indexOf(q)!==-1;
    var matchAnlam=q.length>=3&&v.anlam.toLowerCase().indexOf(q)!==-1;
    if(matchStart) starts.push(v);
    else if(matchAny||matchAnlam) others.push(v);
  }
  var found=starts.concat(others);
  if(!found.length){o.innerHTML='<div style="color:#7a7890;padding:8px">Sonuc yok</div>';return;}
  for(var k=0;k<found.length;k++){
    (function(v){
      var d=document.createElement('div');
      d.className='card';
      d.innerHTML='<div class="cn">'+v.niedo+(v.doko&&v.doko!=='-'?' <span class="cd">/ '+v.doko+'</span>':'')+'</div><div class="ca">'+v.anlam+'</div>';
      d.onclick=function(){t_goster(v);};
      o.appendChild(d);
    })(found[k]);
  }
}

var GN={jm:'bede',jf:'bede',tm:'bedziesz',tf:'bedziesz',on:'bedzie',ona:'bedzie',ono:'bedzie',mm:'bedziemy',mf:'bedziemy',wm:'bedziecie',wf:'bedziecie',oni:'beda',one:'beda'};
var GNP=['jm','jf','tm','tf','on','ona','ono','mm','mf','wm','wf','oni','one'];
var GNL={jm:'ł (erk)',jf:'ł (kad)',tm:'ty (erk)',tf:'ty (kad)',on:'on',ona:'ona',ono:'ono',mm:'my (erk)',mf:'my (kad)',wm:'wy (erk)',wf:'wy (kad)',oni:'oni',one:'one'};

var PL={jm:'ja (erkek)',jf:'ja (kadın)',tm:'ty (erkek)',tf:'ty (kadın)',on:'on',ona:'ona',ono:'ono',mm:'my (erkekler)',mf:'my (kadınlar)',wm:'wy (erkekler)',wf:'wy (kadınlar)',oni:'oni',one:'one'};
var TN={'tr':'Simdiki Zaman','pnm':'Gecmis Niedokonany','pnf':'Gecmis Niedo (kad)','pdm':'Gecmis Dokonany','gd':'Gelecek Dokonany'};

function t_cell(p,val){
  var d=document.createElement('div');
  d.className='cell';
  d.innerHTML='<div class="per">'+(PL[p]||p)+'</div><div class="val">'+val+'</div>';
  return d;
}

function t_satir(forms,keys,cols){
  var present=keys.filter(function(k){return forms[k]!==undefined;});
  if(!present.length)return null;
  var r=document.createElement('div');
  r.className='row';
  r.style.gridTemplateColumns='repeat('+present.length+',1fr)';
  present.forEach(function(p){r.appendChild(t_cell(p,forms[p]));});
  return r;
}

function t_tenseBlock(out,title,forms){
  var h=document.createElement('div');h.className='th';h.textContent=title;out.appendChild(h);
  var w=document.createElement('div');

  // ja+ty row
  var jaM=forms.jm,jaF=forms.jf,tyM=forms.tm,tyF=forms.tf;
  var jaSame=jaM!==undefined&&jaF!==undefined&&jaM===jaF;
  var tySame=tyM!==undefined&&tyF!==undefined&&tyM===tyF;
  var row1=[];
  if(jaSame)row1.push('jm'); else{if(jaM!==undefined)row1.push('jm');if(jaF!==undefined)row1.push('jf');}
  if(tySame)row1.push('tm'); else{if(tyM!==undefined)row1.push('tm');if(tyF!==undefined)row1.push('tf');}
  if(jaSame&&row1.indexOf('jm')>=0){PL.jm='ja';}else{PL.jm='ja (erkek)';}
  if(tySame&&row1.indexOf('tm')>=0){PL.tm='ty';}else{PL.tm='ty (erkek)';}
  var r1=t_satir(forms,row1);if(r1)w.appendChild(r1);

  // on/ona/ono
  var onV=forms.on,onaV=forms.ona,onoV=forms.ono;
  if(onV!==undefined||onaV!==undefined||onoV!==undefined){
    var allSame=true;
    var ref=onV||onaV||onoV;
    if(onV!==undefined&&onV!==ref)allSame=false;
    if(onaV!==undefined&&onaV!==ref)allSame=false;
    if(onoV!==undefined&&onoV!==ref)allSame=false;
    if(allSame){
      var k0=onV!==undefined?'on':onaV!==undefined?'ona':'ono';
      var lbl=[];if(onV!==undefined)lbl.push('on');if(onaV!==undefined)lbl.push('ona');if(onoV!==undefined)lbl.push('ono');
      var tmp={};tmp[k0]=ref;
      var savedLbl=PL[k0];PL[k0]=lbl.join('/');
      var r2=t_satir(tmp,[k0]);if(r2)w.appendChild(r2);
      PL[k0]=savedLbl;
    }else{
      var r2b=t_satir(forms,['on','ona','ono']);if(r2b)w.appendChild(r2b);
    }
  }

  // my
  var myM=forms.mm,myF=forms.mf,myN=forms.my;
  if(myM!==undefined&&myF!==undefined){
    if(myM===myF){var tmp2={mm:myM};var s2=PL.mm;PL.mm='my';var r3=t_satir(tmp2,['mm']);if(r3)w.appendChild(r3);PL.mm=s2;}
    else{var r3b=t_satir(forms,['mm','mf']);if(r3b)w.appendChild(r3b);}
  }else if(myN!==undefined){var r3c=t_satir({my:myN},['my']);if(r3c)w.appendChild(r3c);}

  // wy
  var wyM=forms.wm,wyF=forms.wf,wyN=forms.wy;
  if(wyM!==undefined&&wyF!==undefined){
    if(wyM===wyF){var tmp3={wm:wyM};var s3=PL.wm;PL.wm='wy';var r4=t_satir(tmp3,['wm']);if(r4)w.appendChild(r4);PL.wm=s3;}
    else{var r4b=t_satir(forms,['wm','wf']);if(r4b)w.appendChild(r4b);}
  }else if(wyN!==undefined){var r4c=t_satir({wy:wyN},['wy']);if(r4c)w.appendChild(r4c);}

  // oni/one
  var oniV=forms.oni,oneV=forms.one;
  if(oniV!==undefined||oneV!==undefined){
    if(oniV!==undefined&&oneV!==undefined&&oniV===oneV){
      var tmp4={oni:oniV};var s4=PL.oni;PL.oni='oni/one';var r5=t_satir(tmp4,['oni']);if(r5)w.appendChild(r5);PL.oni=s4;
    }else{var r5b=t_satir(forms,['oni','one']);if(r5b)w.appendChild(r5b);}
  }
  out.appendChild(w);
}

function t_goster(v){
  var o=document.getElementById('t-out');
  o.innerHTML='';
  document.getElementById('inp').value=v.niedo;
  var title=document.createElement('div');title.className='card';
  title.innerHTML='<div class="cn">'+v.niedo+(v.doko&&v.doko!=='-'?' <span class="cd">/ '+v.doko+'</span>':'')+'</div><div class="ca">'+v.anlam+'</div>';
  o.appendChild(title);
  var tkeys=Object.keys(v.forms);
  var shown={};
  for(var i=0;i<tkeys.length;i++){
    var tk=tkeys[i];
    if(shown[tk])continue;
    if(tk==='pnf'&&shown['pnm']){continue;}
    if(tk==='pnm'&&v.forms.pnf){
      var merged={};
      var fm=v.forms.pnm,ff=v.forms.pnf;
      Object.keys(fm).forEach(function(k){merged[k]=fm[k];});
      Object.keys(ff).forEach(function(k){merged[k]=ff[k];});
      t_tenseBlock(o,'Gecmis Niedokonany',merged);
      shown.pnm=true;shown.pnf=true;
    }else{
      t_tenseBlock(o,TN[tk]||tk,v.forms[tk]);
      shown[tk]=true;
    }
  }
  // Gelecek Niedokonany
  var gnF={};
  GNP.forEach(function(p){gnF[p]=(GN[p]||'bedzie')+' '+v.niedo;});
  t_tenseBlock(o,'Gelecek Niedokonany',gnF);
}

(function(){

  }

})();

function rand(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr){
var a=arr.slice();
for (var i=a.length-1; i > 0; i--){
var j=Math.floor(Math.random()*(i+1));
var t=a[i]; a[i]=a[j]; a[j]=t;
}
return a;
}
function B_makeTypo(word){
var SWAPS=[
["ę","e"],["e","ę"],["ą","a"],["a","ą"],["ó","o"],["o","ó"],
["ś","s"],["s","ś"],["ć","c"],["c","ć"],["ź","z"],["ż","z"],
["ń","n"],["ł","l"],["l","ł"],["ie","i"],["i","ie"],
["em","am"],["am","em"]
];
var sw=shuffle(SWAPS);
for (var i=0; i < sw.length; i++){
if (word.indexOf(sw[i][0])!==-1){
var mutated=word.replace(sw[i][0],sw[i][1]);
if (mutated!==word) return mutated;
}
}
if (word.length > 2){
var endings=["e","a","i","y","ę","ą","ł"];
for (var j=0; j < endings.length; j++){
if (!word.endsWith(endings[j])) return word.slice(0,-1) + endings[j];
}
}
return word + "e";
}
function B_generateQuestion(){
var eligible=[];
for (var vi=0; vi < VB.length; vi++){
var vforms=VB[vi].forms;
var hasTense=false;
for (var ti=0; ti < B_enabledTenses.length; ti++){
if (vforms[B_enabledTenses[ti]]){ hasTense=true; break; }
}
if (hasTense) eligible.push(VB[vi]);
}
if (eligible.length===0) eligible=VB.slice();
var verb=rand(eligible);
var availableTenses=[];
for (var t in verb.forms){
if (B_enabledTenses.indexOf(t)!==-1) availableTenses.push(t);
}
if (availableTenses.length===0) availableTenses=Object.keys(verb.forms);
var tense=rand(availableTenses);
var persons=Object.keys(verb.forms[tense]);
var rawPerson=rand(persons);
var person=rawPerson;
if (GENDER_NEUTRAL_PERSONS[rawPerson]){
var gender=Math.random() < 0.5 ? "m" : "f";
person=GENDER_NEUTRAL_PERSONS[rawPerson][gender];
}
var correctAnswer=verb.forms[tense][rawPerson];
var sameVerbForms=[];
for (var tk in verb.forms){
for (var pk in verb.forms[tk]){
if (verb.forms[tk][pk]!==correctAnswer) sameVerbForms.push(verb.forms[tk][pk]);
}
}
sameVerbForms=shuffle(sameVerbForms);
var distractors=[];
var typo=B_makeTypo(correctAnswer);
if (typo!==correctAnswer) distractors.push(typo);
for (var si=0; si < sameVerbForms.length && distractors.length < 3; si++){
distractors.push(sameVerbForms[si]);
}
for (var fi=0; fi < VB.length && distractors.length < 3; fi++){
if (VB[fi].niedo===verb.niedo) continue;
var ft=Object.keys(VB[fi].forms);
for (var fti=0; fti < ft.length && distractors.length < 3; fti++){
var fp=Object.keys(VB[fi].forms[ft[fti]]);
for (var fpi=0; fpi < fp.length && distractors.length < 3; fpi++){
var d=VB[fi].forms[ft[fti]][fp[fpi]];
if (d!==correctAnswer) distractors.push(d);
}
}
}
var options=shuffle([correctAnswer].concat(distractors.slice(0,3)));
return { verb:verb,tense:tense,person:person,correctAnswer:correctAnswer,options:options,typoDistractor:typo };
}
function B_genQuestions(){
var qs=[];
for (var i=0; i < TOTAL; i++) qs.push(B_generateQuestion());
return qs;
}

function B_onAnswer(chosen,btn){
if(B_S.answered) return;
B_S.answered=true;
var q=B_S.questions[B_S.qIndex];
var isCorrect=chosen===q.correctAnswer;
if(isCorrect) B_S.score++;

for(var i=0;i<btns.length;i++){
btns[i].disabled=true;
var optText=btns[i].textContent.slice(1);
if(optText===q.correctAnswer) btns[i].className="opt-btn correct";
else if(btns[i]===btn && !isCorrect) btns[i].className="opt-btn wrong";
if(q.typoDistractor && optText===q.typoDistractor && optText!==q.correctAnswer){
var typoTag=document.createElement("span");
typoTag.className="typo-tag";
typoTag.textContent=" ⚠ yazım tuzağı";
btns[i].appendChild(typoTag);
}
}

if(blank){
blank.textContent=q.correctAnswer;
blank.style.color=isCorrect ? "var(--correct)" : "var(--wrong)";
}

fb.innerHTML="";
fb.style.display="flex";
var icon=document.createElement("span");
icon.className="feedback-icon";
icon.textContent=isCorrect ? "✓" : "✗";

};
var PL_CHARS=[

function Y_getDistractors(ch){
var lower=ch.toLowerCase();
var pool=SIMILAR[lower] ? SIMILAR[lower].slice() : [];
var result=[];
var shuffledPool=shuffle(pool);
for (var i=0; i < shuffledPool.length; i++){
var s=shuffledPool[i];
if (s!==ch && s!==lower && result.length < 3) result.push(s);
}
var filtered=[];
for (var j=0; j < PL_CHARS.length; j++){
if (PL_CHARS[j]!==ch && PL_CHARS[j].toLowerCase()!==lower) filtered.push(PL_CHARS[j]);
}
filtered=shuffle(filtered);
for (var k=0; k < filtered.length && result.length < 3; k++){
result.push(filtered[k]);
}
return result.slice(0,3);
}
function Y_generateQuestion(){
var eligible=[];
for (var vi=0; vi < VB.length; vi++){
if (Object.keys(VB[vi].forms).length > 0) eligible.push(VB[vi]);
}
var verb=rand(eligible);
var availableTenses=Object.keys(verb.forms).filter(function(t){
return Y_enabledTenses.indexOf(t)!==-1;
});
if (availableTenses.length===0) availableTenses=Object.keys(verb.forms);
var tense=rand(availableTenses);
var persons=Object.keys(verb.forms[tense]);
var rawPerson=rand(persons);
var person=rawPerson;
if (GENDER_NEUTRAL_PERSONS[rawPerson]){
var gender=Math.random() < 0.5 ? 'm' : 'f';
person=GENDER_NEUTRAL_PERSONS[rawPerson][gender];
}
var answer=verb.forms[tense][rawPerson];
var letters=answer.split('');
var letterOptions=[];
for (var li=0; li < letters.length; li++){
var distractors=Y_getDistractors(letters[li]);
letterOptions.push(shuffle([letters[li]].concat(distractors)));
}
return { verb: verb,tense: tense,person: person,answer: answer,letters: letters,letterOptions: letterOptions };
}

function Y_renderWordDisplay(){

for (var i=0; i < letters.length; i++){
var ch=letters[i];
if (ch===" "){ slots.push({ch:" ",type:"space"}); continue; }
var mf=filledIdx++;
if (mf < Y_S.filledLetters.length){
var fl=Y_S.filledLetters[mf];
slots.push({ch: fl.char,type: fl.correct ? "filled" : "wrong-filled"});
} else if (i===Y_S.letterIndex && !Y_S.wordDone){
slots.push({ch: "",type: "active"});
}else{
slots.push({ch: "",type: "empty"});
}
}
var MAX=8;
var letterCount=q.answer.replace(/ /g,"").length;
var row1=[],row2=[];
if (letterCount <= MAX || letterCount-MAX < 3){
row1=slots;
}else{
var seen=0;
for (var j=0; j < slots.length; j++){
if (slots[j].type!=="space") seen++;
if (seen <= MAX) row1.push(slots[j]); else row2.push(slots[j]);
}

document.getElementById("y-q-pct-wrap").style.display="";
document.getElementById("y-q-pct-val").textContent=Math.round(Y_S.score / Y_S.qIndex * 100);
}
renderStars("y-word-stars",Y_S.wordStars,TOTAL,22);
Y_renderWordDisplay();
Y_renderLetterOptions();
document.getElementById("y-options-label").textContent=(Y_S.letterIndex+1)+". harf / "+q.letters.length+" harf";
document.getElementById("y-feedback-row").style.display="none";
document.getElementById("y-action-btns").style.display="none";
document.getElementById("y-letter-options").style.display="";
document.getElementById("y-options-label").style.display="";
}
function Y_onLetterPick(ch){
if (Y_S.btnLocked || Y_S.wordDone) return;
Y_S.btnLocked=true;
var q=Y_S.questions[Y_S.qIndex];
var correct=q.letters[Y_S.letterIndex];
var isCorrect=(ch===correct);
if (!isCorrect){ Y_S.mistakes++; Y_S.wordMistakes++; }
var btns=document.getElementById("y-letter-options").getElementsByTagName("button");
for (var i=0; i < btns.length; i++){
btns[i].disabled=true;
if (btns[i].textContent===correct) btns[i].className="letter-btn correct";
else if (btns[i].textContent===ch && !isCorrect) btns[i].className="letter-btn wrong";
}
Y_S.filledLetters.push({char: isCorrect ? ch : correct,correct: isCorrect});
Y_renderWordDisplay();
setTimeout(function(){
Y_S.btnLocked=false;
var nextLetter=Y_S.letterIndex+1;
if (nextLetter >= q.letters.length){
var wm=Y_S.wordMistakes;
var star=wm <= 1 ? "bright" : wm===2 ? "dim" : "dark";
Y_S.wordStars.push(star);
if (wm===0) Y_S.score++;
Y_S.wordDone=true;
renderStars("y-word-stars",Y_S.wordStars,TOTAL,22);
document.getElementById("y-q-score").textContent=Y_S.score;
document.getElementById("y-letter-options").style.display="none";
document.getElementById("y-options-label").style.display="none";
var fb=document.getElementById("y-feedback-row");
fb.innerHTML="";
fb.style.display="flex";
if (Y_S.wordMistakes===0){
var sp=document.createElement("span");
sp.className="correct-fb";
sp.textContent="✓ Kelime tamamlandı!";
fb.appendChild(sp);
}else{
var sp2=document.createElement("span");
sp2.className="wrong-fb";
sp2.textContent="✗ Doğru yazım: ";
var st=document.createElement("strong");
st.textContent=q.answer;
fb.appendChild(sp2);
fb.appendChild(st);
}
document.getElementById("y-action-btns").style.display="flex";
document.getElementById("y-next-btn").textContent =
Y_S.qIndex+1 >= TOTAL ? "Sonuçları Gör →" : "Sonraki Kelime →";
}else{
var skip=nextLetter;
while (skip < q.letters.length && q.letters[skip]===" ") skip++;
Y_S.letterIndex=skip;
Y_renderWordDisplay();
Y_renderLetterOptions();
document.getElementById("y-options-label").textContent =
(Y_S.letterIndex+1)+". harf / "+q.letters.length+" harf";
}
},100);
}
document.getElementById("y-retry-btn").addEventListener("click",function(){
Y_S.wordStars.pop();
Y_S.letterIndex=0;
Y_S.filledLetters=[];
Y_S.btnLocked=false;
Y_S.wordDone=false;
Y_S.wordMistakes=0;
Y_loadQuestion();
});
document.getElementById("y-next-btn").addEventListener("click",function(){
var nextQ=Y_S.qIndex+1;
if (nextQ >= TOTAL){
Y_showResult();
}else{
var nv=Y_S.questions[nextQ];
var si=0;
while (si < nv.letters.length && nv.letters[si]===" ") si++;
Y_S.qIndex=nextQ;
Y_S.letterIndex=si;
Y_S.filledLetters=[];
Y_S.btnLocked=false;
Y_S.wordDone=false;
Y_S.wordMistakes=0;
Y_loadQuestion();
}
});
document.getElementById("y-continue-btn").addEventListener("click",function(){
Y_S.questions=Y_genQuestions();
Y_S.qIndex=0; Y_S.letterIndex=0;
Y_S.filledLetters=[]; Y_S.btnLocked=false;
Y_S.wordDone=false; Y_S.score=0;
Y_S.mistakes=0; Y_S.wordMistakes=0;
Y_S.wordStars=[];
document.getElementById("y-result-screen").style.display="none";
document.getElementById("y-quiz-screen").style.display="block";
Y_loadQuestion();
});
function Y_showResult(){
var pct=Math.round(Y_S.score / TOTAL * 100);
Y_S.starHistory.push(pct);
if (Y_S.starHistory.length > 5) Y_S.starHistory.shift();
document.getElementById("y-result-emoji").textContent=pct>=90?"🏆":pct>=70?"🌟":pct>=50?"💪":"📖";
document.getElementById("y-result-title").textContent=pct>=90?"Mükemmel!":pct>=70?"Çok iyi!":pct>=50?"İyi iş!":"Devam et!";
document.getElementById("y-result-score").textContent=Y_S.score+" / "+TOTAL;
document.getElementById("y-result-pct").textContent="%"+pct+" · "+Y_S.mistakes+" hatalı harf";
renderStars("y-result-word-stars",Y_S.wordStars,TOTAL,22);
renderHistoryStars("y-history-stars",Y_S.starHistory);
document.getElementById("y-quiz-screen").style.display="none";
document.getElementById("y-result-screen").style.display="block";
}
var TENSE_GROUPS={
"tr":       ["tr"],
"niedo-m":     ["pnm","pnf"],
"doko-m":      ["pdm"],
"niedo-f":     ["gn"],
"doko-f":      ["gd"]
};
var Y_enabledTenses=["tr","pnm","pnf","pdm","gn","gd"];
function Y_getEnabledTenses(){
var result=[];
var keys=Object.keys(TENSE_GROUPS);
for (var i=0; i < keys.length; i++){
var chk=document.getElementById("chk-"+keys[i]);
if (chk && chk.checked){
var tenses=TENSE_GROUPS[keys[i]];
for (var j=0; j < tenses.length; j++) result.push(tenses[j]);
}
}
return result.length > 0 ? result : Y_enabledTenses;
}
function Y_toggleCheck(id){
var chk=document.getElementById(id);
if (chk) chk.checked=!chk.checked;
}
function Y_saveSettings(){
Y_enabledTenses=Y_getEnabledTenses();
document.getElementById("y-settings-panel").className="";
Y_S.questions=Y_genQuestions();
Y_S.qIndex=0; Y_S.letterIndex=0;
Y_S.filledLetters=[]; Y_S.btnLocked=false;
Y_S.wordDone=false; Y_S.score=0;
Y_S.mistakes=0; Y_S.wordMistakes=0;
Y_S.wordStars=[];
document.getElementById("y-result-screen").style.display="none";
document.getElementById("y-quiz-screen").style.display="block";
Y_loadQuestion();
}
document.getElementById("b-gear").addEventListener("click",function(e){
e.stopPropagation();
var panel=document.getElementById("y-settings-panel");
panel.className=panel.className==="open" ? "" : "open";
});
document.addEventListener("click",function(e){
var panel=document.getElementById("y-settings-panel");
if (!panel.contains(e.target) && e.target.id!=="b-gear"){
panel.className="";
}
});
Y_S.questions=Y_genQuestions();
document.getElementById("y-quiz-screen").style.display="block";
Y_loadQuestion();

document.getElementById('y-gear').addEventListener('click', function(e){
  e.stopPropagation();
  var p=document.getElementById('y-settings-panel');
  p.className=p.className==='settings-panel open'?'settings-panel':'settings-panel open';
});
document.getElementById('y-settings-save').addEventListener('click', function(){
  document.getElementById('y-settings-panel').className='settings-panel';
  Y_saveSettings();
});
document.getElementById('y-retry-btn').addEventListener('click', function(){
  Y_S.wordStars.pop();Y_S.letterIndex=0;Y_S.filledLetters=[];Y_S.btnLocked=false;Y_S.wordDone=false;Y_S.wordMistakes=0;Y_loadQuestion();
});
function Y_init(){ if(!Y_S.initialized){Y_S.questions=Y_genQuestions();Y_loadQuestion();Y_S.initialized=true;} }

document.addEventListener('click', function(e){
  var bp=document.getElementById('b-settings-panel');
  var bg=document.getElementById('b-gear');
  if(bp&&!bp.contains(e.target)&&e.target!==bg)bp.className='settings-panel';
  var yp=document.getElementById('y-settings-panel');
  var yg=document.getElementById('y-gear');
  if(yp&&!yp.contains(e.target)&&e.target!==yg)yp.className='settings-panel';
});
</script>
