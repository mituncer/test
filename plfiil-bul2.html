}
}
return result.length > 0 ? result : enabledTenses;
}
function saveSettings(){
enabledTenses=getEnabledTenses();
document.getElementById("settings-panel").className="";
startNewRound();
}

function rand(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr){
var a=arr.slice();
for (var i=a.length-1; i > 0; i--){
var j=Math.floor(Math.random()*(i+1));
var t=a[i]; a[i]=a[j]; a[j]=t;
}
return a;
}
function makeTypo(word){
var SWAPS=[
["ę","e"],["e","ę"],["ą","a"],["a","ą"],["ó","o"],["o","ó"],
["ś","s"],["s","ś"],["ć","c"],["c","ć"],["ź","z"],["ż","z"],
["ń","n"],["ł","l"],["l","ł"],["ie","i"],["i","ie"],
["em","am"],["am","em"]
];
var sw=shuffle(SWAPS);
for (var i=0; i < sw.length; i++){
if (word.indexOf(sw[i][0])!==-1){
var mutated=word.replace(sw[i][0],sw[i][1]);
if (mutated!==word) return mutated;
}
}
if (word.length > 2){
var endings=["e","a","i","y","ę","ą","ł"];
for (var j=0; j < endings.length; j++){
if (!word.endsWith(endings[j])) return word.slice(0,-1) + endings[j];
}
}
return word + "e";
}
function generateQuestion(){
var eligible=[];
for (var vi=0; vi < VERBS.length; vi++){
var vforms=VERBS[vi].forms;
var hasTense=false;
for (var ti=0; ti < enabledTenses.length; ti++){
if (vforms[enabledTenses[ti]]){ hasTense=true; break; }
}
if (hasTense) eligible.push(VERBS[vi]);
}
if (eligible.length===0) eligible=VERBS.slice();
var verb=rand(eligible);
var availableTenses=[];
for (var t in verb.forms){
if (enabledTenses.indexOf(t)!==-1) availableTenses.push(t);
}
if (availableTenses.length===0) availableTenses=Object.keys(verb.forms);
var tense=rand(availableTenses);
var persons=Object.keys(verb.forms[tense]);
var rawPerson=rand(persons);
var person=rawPerson;
if (GENDER_NEUTRAL_PERSONS[rawPerson]){
var gender=Math.random() < 0.5 ? "m" : "f";
person=GENDER_NEUTRAL_PERSONS[rawPerson][gender];
}
var correctAnswer=verb.forms[tense][rawPerson];
var sameVerbForms=[];
for (var tk in verb.forms){
for (var pk in verb.forms[tk]){
if (verb.forms[tk][pk]!==correctAnswer) sameVerbForms.push(verb.forms[tk][pk]);
}
}
sameVerbForms=shuffle(sameVerbForms);
var distractors=[];
var typo=makeTypo(correctAnswer);
if (typo!==correctAnswer) distractors.push(typo);
for (var si=0; si < sameVerbForms.length && distractors.length < 3; si++){
distractors.push(sameVerbForms[si]);
}
for (var fi=0; fi < VERBS.length && distractors.length < 3; fi++){
if (VERBS[fi].niedo===verb.niedo) continue;
var ft=Object.keys(VERBS[fi].forms);
for (var fti=0; fti < ft.length && distractors.length < 3; fti++){
var fp=Object.keys(VERBS[fi].forms[ft[fti]]);
for (var fpi=0; fpi < fp.length && distractors.length < 3; fpi++){
var d=VERBS[fi].forms[ft[fti]][fp[fpi]];
if (d!==correctAnswer) distractors.push(d);
}
}
}
var options=shuffle([correctAnswer].concat(distractors.slice(0,3)));
return { verb:verb,tense:tense,person:person,correctAnswer:correctAnswer,options:options,typoDistractor:typo };
}
function genQuestions(){
var qs=[];
for (var i=0; i < TOTAL; i++) qs.push(generateQuestion());
return qs;
}
var S={
questions:[],qIndex:0,score:0,
answered:false,starHistory:[]
};
function makeStar(size,fill,stroke,glow){
var s=document.createElementNS(SVG_NS,"svg");
s.setAttribute("width",size); s.setAttribute("height",size);
s.setAttribute("viewBox","0 0 24 24"); s.style.display="block";
if(glow) s.style.filter=glow;
var p=document.createElementNS(SVG_NS,"polygon");
p.setAttribute("points",STAR_PTS); p.setAttribute("fill",fill);
p.setAttribute("stroke",stroke); p.setAttribute("stroke-width","1.5");
p.setAttribute("stroke-linejoin","round");
s.appendChild(p); return s;
}
function renderHistoryStars(id,history){
var c=document.getElementById(id);
if(!c) return;
c.innerHTML="";
c.style.cssText="display:flex;gap:6px;justify-content:center;margin-top:8px;margin-bottom:4px;flex-wrap:wrap;";
for(var i=0;i<5;i++){
var idx=history.length-5+i;
var pct=(idx>=0&&idx<history.length)?history[idx]:null;
var fill="none",stroke="#3a3a52",glow="";
if(pct!==null){
if(pct>=80){fill="#f5c842";stroke="#f5c842";glow="drop-shadow(0 0 6px #f5c84288)";}
else if(pct>=51){fill="#9a8040";stroke="#9a8040";}
else{fill="#2a2a3a";stroke="#3a3a52";}
}
c.appendChild(makeStar(28,fill,stroke,glow));
}
}

function loadQuestion(){
var q=S.questions[S.qIndex];
S.answered=false;
document.getElementById("v-niedo").textContent=q.verb.niedo;
document.getElementById("v-doko").textContent=q.verb.doko;
document.getElementById("v-anlam").textContent=q.verb.anlam;
document.getElementById("q-tense").textContent=TENSE_LABELS[q.tense]||q.tense;
document.getElementById("q-person").textContent=PERSON_LABELS[q.person]||q.person;
document.getElementById("q-num").textContent=S.qIndex+1;
document.getElementById("q-score").textContent=S.score;
document.getElementById("progress-fill").style.width=(S.qIndex/TOTAL*100)+"%";
if(S.qIndex>0){
document.getElementById("q-pct-wrap").style.display="";
document.getElementById("q-pct-val").textContent=Math.round(S.score/S.qIndex*100);
}
var personWord=(PERSON_LABELS[q.person]||q.person).split(" ")[0];
var promptEl=document.getElementById("q-prompt");
promptEl.textContent=personWord + " ";
var blank=document.createElement("span");
blank.className="blank";
blank.textContent="?";
blank.id="q-blank";
promptEl.appendChild(blank);
var optContainer=document.getElementById("q-options");
optContainer.innerHTML="";
for(var i=0;i<q.options.length;i++){
(function(opt,idx){
var btn=document.createElement("button");
btn.className="opt-btn";
var letter=document.createElement("span");
letter.className="opt-letter";
letter.textContent=LETTERS[idx];
btn.appendChild(letter);
btn.appendChild(document.createTextNode(opt));
btn.addEventListener("click",function(){ onAnswer(opt,btn); });
optContainer.appendChild(btn);
})(q.options[i],i);
}
document.getElementById("feedback-row").style.display="none";
document.getElementById("next-btn").style.display="none";
renderSessionStars();
}
function onAnswer(chosen,btn){
if(S.answered) return;
S.answered=true;
var q=S.questions[S.qIndex];
var isCorrect=chosen===q.correctAnswer;
if(isCorrect) S.score++;
var btns=document.getElementById("q-options").getElementsByTagName("button");
for(var i=0;i<btns.length;i++){
btns[i].disabled=true;
var optText=btns[i].textContent.slice(1);
if(optText===q.correctAnswer) btns[i].className="opt-btn correct";
else if(btns[i]===btn && !isCorrect) btns[i].className="opt-btn wrong";
if(q.typoDistractor && optText===q.typoDistractor && optText!==q.correctAnswer){
var typoTag=document.createElement("span");
typoTag.className="typo-tag";
typoTag.textContent=" ⚠ yazım tuzağı";
btns[i].appendChild(typoTag);
}
}
var blank=document.getElementById("q-blank");
if(blank){
blank.textContent=q.correctAnswer;
blank.style.color=isCorrect ? "var(--correct)" : "var(--wrong)";
}
var fb=document.getElementById("feedback-row");
fb.innerHTML="";
fb.style.display="flex";
var icon=document.createElement("span");
icon.className="feedback-icon";
icon.textContent=isCorrect ? "✓" : "✗";
var txt=document.createElement("span");
txt.className=isCorrect ? "feedback-text correct-fb" : "feedback-text wrong-fb";
txt.textContent=isCorrect ? "Doğru!" : "Yanlış — doğru cevap: " + q.correctAnswer;
fb.appendChild(icon);
fb.appendChild(txt);
var nextBtn=document.getElementById("next-btn");
nextBtn.style.display="block";
nextBtn.textContent=S.qIndex+1>=TOTAL ? "Sonuçları Gör →" : "Sonraki Soru →";
document.getElementById("q-score").textContent=S.score;
}
document.getElementById("next-btn").addEventListener("click",function(){
if(S.qIndex+1 >= TOTAL){
showResult();
}else{
S.qIndex++;
loadQuestion();
}
});
document.getElementById("continue-btn").addEventListener("click",function(){
startNewRound();
});
function showResult(){
var pct=Math.round(S.score/TOTAL*100);
S.starHistory.push(pct);
if(S.starHistory.length>5) S.starHistory.shift();
saveHistory();
document.getElementById("result-emoji").textContent=pct>=90?"🏆":pct>=70?"🌟":pct>=50?"💪":"📖";
document.getElementById("result-title").textContent=pct>=90?"Mükemmel!":pct>=70?"Çok iyi!":pct>=50?"İyi iş!":"Devam et!";
document.getElementById("result-score").textContent=S.score+" / "+TOTAL;
document.getElementById("result-pct").textContent="%"+pct+" başarı";
renderHistoryStars("history-stars",S.starHistory);
document.getElementById("quiz-screen").style.display="none";
document.getElementById("result-screen").style.display="block";
}
function startNewRound(){
S.questions=genQuestions();
S.qIndex=0; S.score=0; S.answered=false;
document.getElementById("result-screen").style.display="none";
document.getElementById("quiz-screen").style.display="block";
document.getElementById("q-pct-wrap").style.display="none";
loadQuestion();
}
startNewRound();</script></body></html>
