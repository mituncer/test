<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diyet Takip</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF7F2;
    --paper: #F2EDE4;
    --ink: #1C1C1A;
    --ink-soft: #5A5750;
    --green: #3A6B4A;
    --green-mid: #5C8F6A;
    --green-light: #D4E8DA;
    --amber: #C97D2E;
    --amber-light: #F5E6CF;
    --red: #C0392B;
    --red-light: #FCEAEA;
    --border: #DDD8CE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* HEADER */
  header {
    background: var(--green);
    padding: 20px 16px 14px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    color: #fff; font-size: 22px; letter-spacing: 0.3px;
  }
  .settings-btn {
    background: rgba(255,255,255,0.18);
    border: none; color: #fff;
    width: 36px; height: 36px; border-radius: 10px;
    cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .settings-btn:hover { background: rgba(255,255,255,0.3); }
  header .date-nav {
    display: flex; align-items: center; gap: 10px;
  }
  header .date-label {
    color: rgba(255,255,255,0.85);
    font-size: 13px; font-weight: 500; flex: 1;
  }
  header .nav-btn {
    background: rgba(255,255,255,0.18);
    border: none; color: #fff;
    width: 30px; height: 30px; border-radius: 8px;
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  header .nav-btn:hover { background: rgba(255,255,255,0.3); }
  header .nav-btn:disabled { opacity: 0.35; cursor: default; }

  /* PROGRESS */
  .progress-bar-wrap {
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
  }
  .progress-label {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--ink-soft); margin-bottom: 6px;
  }
  .progress-groups { display: flex; gap: 6px; }
  .pg { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .pg-name { font-size: 10px; font-weight: 500; color: var(--ink-soft); text-align: center; }
  .pg-bar-bg { height: 7px; border-radius: 4px; overflow: visible; position: relative; }
  .pg-bar-track {
    position: absolute; inset: 0;
    background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .pg-bar-fill {
    height: 100%; border-radius: 4px;
    transition: width 0.4s ease, background 0.3s ease;
  }
  /* limit marker line */
  .pg-limit-marker {
    position: absolute; top: -2px; bottom: -2px;
    width: 2px; border-radius: 1px;
    background: var(--red); opacity: 0.7;
    transition: left 0.3s;
  }
  .pg-info {
    display: flex; justify-content: space-between; align-items: center;
  }
  .pg-count { font-size: 10px; font-weight: 700; text-align: left; color: var(--ink); }
  .pg-limit-txt { font-size: 9px; color: var(--ink-soft); }
  .pg-count.over-limit { color: var(--red); }

  /* GRID */
  .grid-container { padding: 16px 10px 0; }
  .grid-header {
    display: grid;
    grid-template-columns: 72px repeat(6, 1fr);
    gap: 5px; margin-bottom: 5px; padding: 0 2px;
  }
  .gh-empty {}
  .gh-item {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 3px; text-align: center;
  }
  .gh-icon { font-size: 18px; display: block; }
  .gh-name { font-size: 9px; font-weight: 600; color: var(--ink-soft); letter-spacing: 0.3px; }

  .meal-row {
    display: grid;
    grid-template-columns: 72px repeat(6, 1fr);
    gap: 5px; margin-bottom: 5px; padding: 0 2px;
  }
  .meal-label {
    display: flex; flex-direction: column;
    justify-content: center; padding: 4px 4px 4px 2px;
  }
  .ml-time { font-size: 10px; color: var(--ink-soft); font-weight: 500; }
  .ml-name { font-size: 11px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .ml-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--green-mid); margin-top: 3px;
  }
  .meal-label.ara .ml-dot { background: var(--amber); }

  .cell {
    background: #fff; border: 1.5px solid var(--border);
    border-radius: 10px; min-height: 52px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; transition: all 0.15s ease;
  }
  .cell:hover {
    border-color: var(--green-mid);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(92,143,106,0.2);
  }
  .cell.filled { background: var(--green-light); border-color: var(--green-mid); }
  .cell.ara-filled { background: var(--amber-light); border-color: var(--amber); }
  .cell-count { font-size: 17px; font-weight: 700; color: var(--green); line-height: 1; }
  .cell.ara-filled .cell-count { color: var(--amber); }
  .cell-unit { font-size: 8px; color: var(--ink-soft); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
  .cell-plus { font-size: 20px; color: var(--border); line-height: 1; font-weight: 300; }
  .cell:hover .cell-plus { color: var(--green-mid); }

  /* TOTALS */
  .totals-row {
    display: grid; grid-template-columns: 72px repeat(6, 1fr);
    gap: 5px; padding: 5px 2px 0;
    border-top: 2px solid var(--border); margin-top: 4px;
  }
  .totals-label {
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
    padding-right: 4px; font-size: 10px; font-weight: 700;
    color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .totals-cell {
    border: 1.5px solid var(--border);
    border-radius: 10px; padding: 8px 4px; text-align: center;
    transition: background 0.3s, border-color 0.3s;
  }
  .totals-cell.ok { background: var(--green-light); border-color: var(--green-mid); }
  .totals-cell.over { background: var(--red-light); border-color: var(--red); }
  .totals-cell.neutral { background: var(--paper); }
  .tc-num {
    font-family: 'DM Serif Display', serif;
    font-size: 20px; line-height: 1;
    transition: color 0.3s;
  }
  .totals-cell.ok .tc-num { color: var(--green); }
  .totals-cell.over .tc-num { color: var(--red); }
  .totals-cell.neutral .tc-num { color: var(--ink-soft); }
  .tc-limit { font-size: 8px; color: var(--ink-soft); font-weight: 500; margin-top: 1px; }
  .tc-unit { font-size: 8px; color: var(--ink-soft); font-weight: 500; text-transform: uppercase; }

  /* NOTES */
  .notes-section {
    margin: 16px 12px 0;
    padding: 12px 14px;
    background: #fff; border-radius: 12px; border: 1px solid var(--border);
  }
  .notes-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); margin-bottom: 6px; }
  .notes-input {
    width: 100%; border: none; background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
    resize: none; outline: none; min-height: 44px;
  }
  .notes-input::placeholder { color: var(--border); }

  .tc-kcal { font-size: 8px; color: var(--ink-soft); font-weight: 500; margin-top: 1px; opacity: 0.75; }
  .totals-cell.ok .tc-kcal, .totals-cell.over .tc-kcal { opacity: 1; }
  .grand-kcal-row {
    text-align: right; padding: 4px 6px 0;
    font-size: 10px; font-weight: 600; color: var(--ink-soft);
    min-height: 16px;
  }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(28,28,26,0.55);
    z-index: 200; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--cream); border-radius: 20px 20px 0 0;
    padding: 20px 20px 36px; width: 100%; max-width: 480px;
    animation: slideUp 0.25s ease;
    max-height: 92vh; overflow-y: auto;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-handle {
    width: 36px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 0 auto 18px;
  }
  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px; color: var(--green); margin-bottom: 4px;
  }
  .modal-subtitle { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }
  .modal-stepper {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-bottom: 24px;
  }
  .stepper-btn {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid var(--green); background: transparent;
    color: var(--green); font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .stepper-btn:hover { background: var(--green); color: #fff; }
  .stepper-value {
    font-family: 'DM Serif Display', serif;
    font-size: 52px; color: var(--ink); min-width: 76px;
    text-align: center; line-height: 1;
  }
  .stepper-unit { font-size: 13px; color: var(--ink-soft); text-align: center; margin-top: -2px; }
  .modal-presets { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .preset-btn {
    padding: 6px 12px; border-radius: 20px;
    border: 1.5px solid var(--border); background: #fff;
    font-size: 12px; font-weight: 500; cursor: pointer;
    color: var(--ink-soft); transition: all 0.15s;
  }
  .preset-btn:hover, .preset-btn.active {
    border-color: var(--green); background: var(--green-light); color: var(--green);
  }
  .modal-actions { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1; padding: 13px; border-radius: 12px;
    border: 1.5px solid var(--border); background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    font-weight: 500; cursor: pointer; color: var(--ink-soft);
  }
  .btn-save {
    flex: 2; padding: 13px; border-radius: 12px; border: none;
    background: var(--green); color: #fff;
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  .btn-save:hover { background: #2d5239; }

  .kcal-card {
    background: linear-gradient(135deg, #1C3A28 0%, #2d5239 100%);
    border-radius: 12px; padding: 11px 14px;
    margin-top: 4px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .kcal-left { flex-shrink: 0; }
  .kcal-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: rgba(255,255,255,0.55); margin-bottom: 2px;
  }
  .kcal-value {
    font-family: 'DM Serif Display', serif;
    font-size: 26px; color: #fff; line-height: 1;
  }
  .kcal-unit { font-size: 13px; color: rgba(255,255,255,0.65); }
  .kcal-right { flex: 1; min-width: 0; }
  .kcal-breakdown { display: flex; flex-wrap: wrap; gap: 4px; }
  .kcal-chip {
    background: rgba(255,255,255,0.15); border-radius: 16px;
    padding: 3px 7px; font-size: 11px; color: #fff; font-weight: 500;
  }
  .kcal-note {
    font-size: 9px; color: rgba(255,255,255,0.4); margin-top: 4px; line-height: 1.3;
  }

  .ref-modal {
    background: var(--cream); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px; animation: slideUp 0.25s ease;
    max-height: 88vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .ref-header {
    padding: 20px 20px 0; flex-shrink: 0;
  }
  .ref-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px; color: var(--ink); margin-bottom: 14px;
  }
  .ref-tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px;
    scrollbar-width: none;
  }
  .ref-tabs::-webkit-scrollbar { display: none; }
  .ref-tab {
    flex-shrink: 0; padding: 7px 14px; border-radius: 20px;
    border: 1.5px solid var(--border); background: #fff;
    font-size: 12px; font-weight: 600; cursor: pointer;
    color: var(--ink-soft); white-space: nowrap; transition: all 0.15s;
  }
  .ref-tab.active {
    border-color: var(--green); background: var(--green); color: #fff;
  }
  .ref-content {
    flex: 1; overflow-y: auto; padding: 0 16px 16px;
  }
  .ref-section { margin-bottom: 18px; }
  .ref-section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--ink-soft);
    padding: 10px 4px 6px; border-bottom: 1px solid var(--border);
    margin-bottom: 6px; position: sticky; top: 0;
    background: var(--cream); z-index: 1;
  }
  .ref-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 7px 8px; border-radius: 8px; gap: 8px;
  }
  .ref-row:nth-child(even) { background: var(--paper); }
  .ref-food { font-size: 13px; color: var(--ink); font-weight: 500; flex: 1; }
  .ref-measure { font-size: 12px; color: var(--ink-soft); text-align: right; flex-shrink: 0; }
  .ref-gram { font-size: 11px; color: var(--border); margin-left: 6px; }
  .ref-combo {
    display: inline-block; background: var(--amber-light);
    color: var(--amber); font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 10px; margin-left: 6px;
  }

  .settings-modal { background: var(--cream); border-radius: 20px 20px 0 0; padding: 20px 20px 36px; width: 100%; max-width: 480px; animation: slideUp 0.25s ease; }
  .settings-title { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); margin-bottom: 4px; }
  .settings-subtitle { font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; }
  .settings-group {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: #fff;
    border: 1.5px solid var(--border); border-radius: 12px; margin-bottom: 10px;
  }
  .sg-left { display: flex; align-items: center; gap: 10px; }
  .sg-icon { font-size: 24px; }
  .sg-name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .sg-unit { font-size: 11px; color: var(--ink-soft); }
  .sg-right { display: flex; align-items: center; gap: 8px; }
  .sg-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1.5px solid var(--border); background: transparent;
    color: var(--ink); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .sg-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-light); }
  .sg-val {
    font-family: 'DM Serif Display', serif;
    font-size: 26px; color: var(--green); min-width: 36px; text-align: center;
  }
  .settings-info {
    background: var(--green-light); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 20px;
    font-size: 12px; color: var(--green); font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🌿 Diyet Takip</h1>
    <div style="display:flex;gap:8px;">
      <button class="settings-btn" id="openRef" title="Besin Referansı">📋</button>
      <button class="settings-btn" id="openSettings" title="Ayarlar">⚙️</button>
    </div>
  </div>
  <div class="date-nav">
    <button class="nav-btn" id="prevDay">‹</button>
    <span class="date-label" id="dateLabel"></span>
    <button class="nav-btn" id="nextDay" disabled>›</button>
  </div>
</header>

<div class="progress-bar-wrap">
  <div class="progress-label">Günlük Özet</div>
  <div class="progress-groups" id="progressGroups"></div>
</div>

<div class="grid-container">
  <div class="grid-header" id="gridHeader"></div>
  <div id="mealRows"></div>
  <div class="totals-row" id="totalsRow"></div>
</div>

<div class="notes-section">
  <div class="notes-label">📝 Notlar</div>
  <textarea class="notes-input" id="notesInput" placeholder="Bugünkü notlarınız..." rows="2"></textarea>
</div>

<!-- ENTRY MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;">
      <div>
        <div class="modal-title" id="modalTitle">Süt</div>
        <div class="modal-subtitle" id="modalSubtitle">Sabah</div>
      </div>
      <button onclick="openRefFromEntry()" style="background:var(--green-light);border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--green);cursor:pointer;margin-top:2px;flex-shrink:0;">📋 Liste</button>
    </div>
    <div class="modal-stepper">
      <button class="stepper-btn" id="stepDown">−</button>
      <div>
        <div class="stepper-value" id="stepperVal">0</div>
        <div class="stepper-unit" id="stepperUnit">porsiyon</div>
      </div>
      <button class="stepper-btn" id="stepUp">+</button>
    </div>
    <div class="modal-presets" id="presets"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">İptal</button>
      <button class="btn-save" id="modalSave">Kaydet</button>
    </div>
  </div>
</div>

<!-- REFERENCE MODAL -->
<div class="modal-overlay" id="refOverlay">
  <div class="ref-modal">
    <div class="modal-handle"></div>
    <div class="ref-header">
      <div class="ref-title">📋 Besin Referansı</div>
      <div class="ref-tabs" id="refTabs"></div>
    </div>
    <div class="ref-content" id="refContent"></div>
    <div style="padding:0 20px 4px;">
      <button class="btn-cancel" style="width:100%;padding:13px;" id="refClose">Kapat</button>
    </div>
  </div>
</div>


<div class="modal-overlay" id="settingsOverlay">
  <div class="settings-modal">
    <div class="modal-handle"></div>
    <div class="settings-title">⚙️ Günlük Limitler</div>
    <div class="settings-subtitle">Her besin grubu için maksimum günlük porsiyon sayısını ayarlayın.</div>
    <div class="settings-info">💡 Limit aşılınca toplam satırı ve özet çubuğu kırmızıya döner.</div>
    <div id="settingsGroups"></div>
    <div class="modal-actions">
      <button class="btn-save" id="settingsClose" style="flex:1">Kapat</button>
    </div>
  </div>
</div>

<script>
// ─── GROUPS & MEALS ───────────────────────────────────────────
const GROUPS = [
  { key: 'sut',   name: 'Süt',   icon: '🥛', unit: 'porsiyon', barColor: '#3A6B4A', kcal: 120 },
  { key: 'et',    name: 'Et',    icon: '🍗', unit: 'porsiyon', barColor: '#7B4F3A', kcal: 75  },
  { key: 'ekmek', name: 'Ekmek', icon: '🍞', unit: 'dilim',    barColor: '#C97D2E', kcal: 70  },
  { key: 'meyve', name: 'Meyve', icon: '🍎', unit: 'porsiyon', barColor: '#2E7D6B', kcal: 60  },
  { key: 'yag',   name: 'Yağ',   icon: '🫒', unit: 'çay k.',   barColor: '#8B7355', kcal: 45  },
  { key: 'seker', name: 'Şeker', icon: '🍬', unit: 'porsiyon', barColor: '#B0396A', kcal: 150 },
];

const MEALS = [
  { key: 'sabah', name: 'Sabah',      time: '07:00', ara: false },
  { key: 'ara1',  name: 'Ara Öğün',   time: '10:00', ara: true  },
  { key: 'ogle',  name: 'Öğle',       time: '13:00', ara: false },
  { key: 'ara2',  name: 'Ara Öğün',   time: '16:00', ara: true  },
  { key: 'aksam', name: 'Akşam',      time: '19:00', ara: false },
  { key: 'gece',  name: 'Gece Arası', time: '21:30', ara: true  },
];

// Default limits (Mustafa's setup: 4,6,5,4,6)
const DEFAULT_LIMITS = { sut: 4, et: 6, ekmek: 5, meyve: 4, yag: 6, seker: 3 };

// ─── STATE ────────────────────────────────────────────────────
let store   = JSON.parse(localStorage.getItem('diyet_v1') || '{}');
let limits  = JSON.parse(localStorage.getItem('diyet_limits') || JSON.stringify(DEFAULT_LIMITS));
let tempLimits = {};
let currentDate = todayStr();
let entryModal  = { meal: null, group: null, value: 0 };

// ─── HELPERS ─────────────────────────────────────────────────
function todayStr() { return new Date().toISOString().slice(0,10); }

function formatDateTR(str) {
  const d = new Date(str + 'T12:00:00');
  const days   = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  if (str === todayStr()) return `Bugün — ${d.getDate()} ${months[d.getMonth()]}`;
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  if (str === yest.toISOString().slice(0,10)) return `Dün — ${d.getDate()} ${months[d.getMonth()]}`;
  return `${days[d.getDay()]} — ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function getData(date, meal, group) {
  return (store[date] && store[date][meal+'_'+group]) || 0;
}
function setData(date, meal, group, val) {
  if (!store[date]) store[date] = {};
  store[date][meal+'_'+group] = val;
  localStorage.setItem('diyet_v1', JSON.stringify(store));
}
function getNotes(date) { return (store[date] && store[date]['_notes']) || ''; }
function setNotes(date, txt) {
  if (!store[date]) store[date] = {};
  store[date]['_notes'] = txt;
  localStorage.setItem('diyet_v1', JSON.stringify(store));
}
function getLimit(key) { return limits[key] ?? 1; }
function getDayTotal(date, groupKey) {
  return MEALS.reduce((s, m) => s + getData(date, m.key, groupKey), 0);
}

// ─── REFRESH ──────────────────────────────────────────────────
function refreshDisplay() {
  document.getElementById('dateLabel').textContent = formatDateTR(currentDate);
  document.getElementById('nextDay').disabled = currentDate >= todayStr();

  // cells
  MEALS.forEach(m => {
    GROUPS.forEach(g => {
      const v = getData(currentDate, m.key, g.key);
      const cell = document.getElementById(`cell_${m.key}_${g.key}`);
      cell.className = 'cell' + (v > 0 ? (m.ara ? ' ara-filled' : ' filled') : '');
      cell.innerHTML = v > 0
        ? `<span class="cell-count">${v}</span>`
        : `<span class="cell-plus">+</span>`;
    });
  });

  // totals + progress
  let grandKcal = 0;
  GROUPS.forEach(g => {
    const total = getDayTotal(currentDate, g.key);
    const lim   = getLimit(g.key);
    const over  = total > lim;
    const hasData = total > 0;
    const kcal  = total * g.kcal;
    grandKcal  += kcal;

    // totals cell
    const totCell = document.getElementById(`tot_${g.key}`);
    totCell.className = 'totals-cell ' + (hasData ? (over ? 'over' : 'ok') : 'neutral');
    document.getElementById(`tc-num_${g.key}`).textContent = total;
    document.getElementById(`tc-limit_${g.key}`).textContent = `/ ${lim}`;
    document.getElementById(`tc-kcal_${g.key}`).textContent = kcal > 0 ? `${kcal} kcal` : '';

    // progress bar — cap visual at 120% of limit so overflow is visible
    const maxVisual = lim * 1.2;
    const pct = Math.min(100, (total / maxVisual) * 100);
    const bar = document.getElementById(`pgbar_${g.key}`);
    bar.style.width = pct + '%';
    bar.style.background = over ? 'var(--red)' : g.barColor;

    // limit marker at 100/120 = 83.3% of bar width
    const markerPct = (1 / 1.2) * 100;
    document.getElementById(`pglimit_${g.key}`).style.left = markerPct + '%';

    // count label
    const countEl = document.getElementById(`pgcount_${g.key}`);
    countEl.textContent = total;
    countEl.className = 'pg-count' + (over ? ' over-limit' : '');
    document.getElementById(`pglimittxt_${g.key}`).textContent = `/${lim}`;
  });

  // grand kcal label
  const grandEl = document.getElementById('grandKcal');
  if (grandEl) grandEl.textContent = grandKcal > 0 ? `≈ ${grandKcal} kcal` : '';

  document.getElementById('notesInput').value = getNotes(currentDate);
}

function openEntryModal(mealKey, groupKey) {
  const m = MEALS.find(x => x.key === mealKey);
  const g = GROUPS.find(x => x.key === groupKey);
  entryModal = { meal: mealKey, group: groupKey, value: getData(currentDate, mealKey, groupKey) };

  document.getElementById('modalTitle').textContent    = g.icon + ' ' + g.name;
  document.getElementById('modalSubtitle').textContent = m.name;
  document.getElementById('stepperUnit').textContent   = g.unit;

  const presets = [0.5, 1, 1.5, 2, 3];
  document.getElementById('presets').innerHTML = presets.map(p =>
    `<button class="preset-btn ${entryModal.value === p ? 'active' : ''}" onclick="setEntryPreset(${p})">${p}</button>`
  ).join('');

  updateStepperDisplay();
  document.getElementById('modalOverlay').classList.add('open');
}

function setEntryPreset(v) {
  entryModal.value = v;
  document.querySelectorAll('#presets .preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  updateStepperDisplay();
}
function updateStepperDisplay() {
  document.getElementById('stepperVal').textContent = entryModal.value;
}

document.getElementById('stepDown').onclick = () => {
  entryModal.value = Math.max(0, parseFloat((entryModal.value - 0.5).toFixed(1)));
  updateStepperDisplay();
};
document.getElementById('stepUp').onclick = () => {
  entryModal.value = parseFloat((entryModal.value + 0.5).toFixed(1));
  updateStepperDisplay();
};
document.getElementById('modalCancel').onclick = () => document.getElementById('modalOverlay').classList.remove('open');
document.getElementById('modalOverlay').onclick = (e) => {
  if (e.target === document.getElementById('modalOverlay')) document.getElementById('modalOverlay').classList.remove('open');
};
document.getElementById('modalSave').onclick = () => {
  setData(currentDate, entryModal.meal, entryModal.group, entryModal.value);
  refreshDisplay();
  document.getElementById('modalOverlay').classList.remove('open');
};

function openSettings() {
  tempLimits = { ...limits };
  renderSettingsGroups();
  document.getElementById('settingsOverlay').classList.add('open');
}

function calcTotalKcal(lims) {
  return GROUPS.reduce((sum, g) => sum + (lims[g.key] ?? 0) * g.kcal, 0);
}

function renderSettingsGroups() {
  const total = calcTotalKcal(limits);
  document.getElementById('settingsGroups').innerHTML = GROUPS.map(g => `
    <div class="settings-group">
      <div class="sg-left" onclick="openRefFromSettings('${g.key}')" style="cursor:pointer;flex:1;">
        <span class="sg-icon">${g.icon}</span>
        <div>
          <div class="sg-name" style="text-decoration:underline dotted;text-underline-offset:3px;">${g.name} ↗</div>
          <div class="sg-unit">${g.unit} / gün · ${g.kcal} kcal/porsiyon</div>
        </div>
      </div>
      <div class="sg-right">
        <button class="sg-btn" onclick="changeTempLimit('${g.key}', -1)">−</button>
        <div class="sg-val" id="slval_${g.key}">${limits[g.key]}</div>
        <button class="sg-btn" onclick="changeTempLimit('${g.key}', +1)">+</button>
      </div>
    </div>`).join('') + `
  <div class="kcal-card" id="kcalCard">
    <div class="kcal-left">
      <div class="kcal-label">Kalori Limiti</div>
      <div class="kcal-value"><span id="kcalTotal">${total}</span> <span class="kcal-unit">kcal</span></div>
    </div>
    <div class="kcal-right">
      <div class="kcal-breakdown" id="kcalBreakdown">${renderKcalBreakdown(limits)}</div>
      <div class="kcal-note">Değişim sistemi ortalaması</div>
    </div>
  </div>`;
}

function renderKcalBreakdown(lims) {
  return GROUPS.filter(g => (lims[g.key] ?? 0) > 0).map(g => {
    const k = (lims[g.key] ?? 0) * g.kcal;
    return `<span class="kcal-chip">${g.icon} ${k}</span>`;
  }).join('');
}

function changeTempLimit(key, delta) {
  limits[key] = Math.max(0, (limits[key] ?? 0) + delta);
  localStorage.setItem('diyet_limits', JSON.stringify(limits));
  document.getElementById(`slval_${key}`).textContent = limits[key];
  // live update calorie card
  const total = calcTotalKcal(limits);
  document.getElementById('kcalTotal').textContent = total;
  document.getElementById('kcalBreakdown').innerHTML = renderKcalBreakdown(limits);
  // update main display
  buildTotals();
  buildProgress();
  refreshDisplay();
}

document.getElementById('openSettings').onclick = () => {
  renderSettingsGroups();
  document.getElementById('settingsOverlay').classList.add('open');
};
document.getElementById('settingsOverlay').onclick = (e) => {
  if (e.target === document.getElementById('settingsOverlay')) document.getElementById('settingsOverlay').classList.remove('open');
};

document.getElementById('settingsClose').onclick = () => document.getElementById('settingsOverlay').classList.remove('open');

}

}

function openRefFromMain(groupKey) {
  const keyMap = { sut: 'sut', et: 'et', ekmek: 'ekmek', meyve: 'meyve', yag: 'yag', seker: 'yag' };
  activeRefTab = keyMap[groupKey] || 'ekmek';
  refOrigin = 'main';
  renderRefTabs();
  renderRefContent(activeRefTab);
  document.getElementById('refOverlay').classList.add('open');
}

function openRefFromEntry() {
  const keyMap = { sut: 'sut', et: 'et', ekmek: 'ekmek', meyve: 'meyve', yag: 'yag', seker: 'yag' };
  activeRefTab = keyMap[entryModal.group] || 'ekmek';
  refOrigin = 'entry';
  document.getElementById('modalOverlay').classList.remove('open');
  renderRefTabs();
  renderRefContent(activeRefTab);
  document.getElementById('refOverlay').classList.add('open');
}

function closeRef() {
  document.getElementById('refOverlay').classList.remove('open');
  if (refOrigin === 'settings') {
    renderSettingsGroups();
    document.getElementById('settingsOverlay').classList.add('open');
  } else if (refOrigin === 'entry') {
    document.getElementById('modalOverlay').classList.add('open');
  }
}

function renderRefTabs() {
  document.getElementById('refTabs').innerHTML = REF_DATA.map(g =>
    `<button class="ref-tab ${g.key === activeRefTab ? 'active' : ''}"
      onclick="switchRefTab('${g.key}')">${g.label}</button>`
  ).join('');
}

function switchRefTab(key) {
  activeRefTab = key;
  renderRefTabs();
  renderRefContent(key);
  document.getElementById('refContent').scrollTop = 0;
}

function renderRefContent(key) {
  const group = REF_DATA.find(g => g.key === key);
  document.getElementById('refContent').innerHTML = group.sections.map(sec => `
    <div class="ref-section">
      <div class="ref-section-title">${sec.title}</div>
      ${sec.rows.map(([food, measure, extra]) => `
        <div class="ref-row">
          <span class="ref-food">${food}</span>
          <span class="ref-measure">${measure}${extra ? `<span class="${key === 'combo' ? 'ref-combo' : 'ref-gram'}"> ${extra}</span>` : ''}</span>
        </div>`).join('')}
    </div>`).join('');
}

document.getElementById('openRef').onclick = openRef;
document.getElementById('refClose').onclick = closeRef;
document.getElementById('refOverlay').onclick = (e) => {
  if (e.target === document.getElementById('refOverlay')) closeRef();
};


document.getElementById('prevDay').onclick = () => {
  const d = new Date(currentDate + 'T12:00:00');
  d.setDate(d.getDate()-1);
  currentDate = d.toISOString().slice(0,10);
  refreshDisplay();
};
document.getElementById('nextDay').onclick = () => {
  const d = new Date(currentDate + 'T12:00:00');
  d.setDate(d.getDate()+1);
  const next = d.toISOString().slice(0,10);
  if (next <= todayStr()) { currentDate = next; refreshDisplay(); }
};

document.getElementById('notesInput').oninput = (e) => setNotes(currentDate, e.target.value);

// ─── INIT ────────────────────────────────────────────────────
buildGridHeader();
buildRows();
buildTotals();
buildProgress();
refreshDisplay();
</script>
</body>
</html>
